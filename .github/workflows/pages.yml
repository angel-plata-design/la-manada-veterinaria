name: Build GitHub Pages files

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Poppins bold update
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          page_text = page.read_text(encoding='utf-8').replace('font-black', 'font-bold')
          page.write_text(page_text, encoding='utf-8')

          layout = Path('app/layout.tsx')
          layout_text = layout.read_text(encoding='utf-8').replace(
              "weight: ['300', '400', '500', '600', '700', '800', '900']",
              "weight: ['300', '400', '500', '600', '700']",
          )
          layout.write_text(layout_text, encoding='utf-8')

          css = Path('github-pages/globals.css')
          css_text = css.read_text(encoding='utf-8').replace(
              'Poppins:wght@300;400;500;600;700;800;900',
              'Poppins:wght@300;400;500;600;700',
          )
          css.write_text(css_text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install
        working-directory: github-pages

      - name: Build static site
        run: npm run build
        working-directory: github-pages

      - name: Keep GitHub Pages assets intact
        run: touch docs/.nojekyll

      - name: Commit Poppins update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.tsx app/page.tsx github-pages/globals.css docs
          if git diff --cached --quiet; then
            echo "No Poppins changes to commit"
          else
            git commit -m "Use Poppins bold typography [skip ci]"
            git push
          fi
