name: Fix mobile menu layout

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch mobile menu full screen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          page_path = Path('app/page.tsx')
          page = page_path.read_text(encoding='utf-8')
          replacements = {
              '<details className="group md:hidden">': '<details className="mobile-menu group md:hidden">',
              'className="flex h-12 w-12 cursor-pointer items-center justify-center rounded-full border border-[#c8e1d8] bg-white text-[#073b75] shadow-[0_12px_28px_rgba(7,59,117,0.12)] transition hover:bg-[#eaf7ee] focus:outline-none focus:ring-4 focus:ring-[#9fe3d3]"': 'className="mobile-menu-toggle flex h-12 w-12 cursor-pointer items-center justify-center rounded-full border border-[#c8e1d8] bg-white text-[#073b75] shadow-[0_12px_28px_rgba(7,59,117,0.12)] transition hover:bg-[#eaf7ee] focus:outline-none focus:ring-4 focus:ring-[#9fe3d3]"',
              '<div className="fixed inset-x-0 bottom-0 top-[73px] z-50 overflow-y-auto bg-[#f7fbf5] px-5 pb-[calc(6rem+env(safe-area-inset-bottom))] pt-7 shadow-[0_30px_80px_rgba(7,59,117,0.2)]">': '<div className="mobile-menu-panel">',
              '<div className="mx-auto flex min-h-full max-w-sm flex-col justify-between gap-8">': '<div className="mobile-menu-shell">',
              'className="h-auto w-56 max-w-full object-contain"': 'className="mobile-menu-logo h-auto max-w-full object-contain"',
              '<nav className="mt-8 grid gap-2" aria-label="Menú móvil">': '<nav className="mobile-menu-nav" aria-label="Menú móvil">',
              'className="group/link flex min-h-16 cursor-pointer items-center justify-between border-b border-[#d7ebe4] py-4 text-2xl font-bold leading-snug text-[#073b75] transition hover:text-[#0b7f78] focus:outline-none focus:ring-4 focus:ring-[#9fe3d3]"': 'className="mobile-menu-link group/link cursor-pointer"',
              'className="flex h-9 w-9 items-center justify-center rounded-full bg-[#eaf7ee] text-xs font-bold text-[#0b7f78] transition group-hover/link:bg-[#d9f8ee]"': 'className="mobile-menu-index"',
              'className="inline-flex min-h-14 cursor-pointer items-center justify-center rounded-full bg-[#073b75] px-6 text-base font-bold text-white shadow-[0_14px_30px_rgba(7,59,117,0.18)] transition hover:bg-[#0b7f78] focus:outline-none focus:ring-4 focus:ring-[#9fe3d3]"': 'className="mobile-menu-map cursor-pointer"',
          }
          for old, new in replacements.items():
              if old in page:
                  page = page.replace(old, new)
          if '<details className="mobile-menu group md:hidden">' not in page:
              raise SystemExit('Mobile menu details class not patched')
          if '<div className="mobile-menu-panel">' not in page:
              raise SystemExit('Mobile menu panel class not patched')
          page_path.write_text(page, encoding='utf-8')

          css_path = Path('app/globals.css')
          css = css_path.read_text(encoding='utf-8')
          mobile_css = '''body:has(.mobile-menu[open]) {
            overflow: hidden;
          }

          .mobile-menu[open] > .mobile-menu-toggle {
            position: fixed;
            top: calc(0.75rem + env(safe-area-inset-top));
            right: 1.25rem;
            z-index: 90;
          }

          .mobile-menu-panel {
            position: fixed;
            inset: 0;
            z-index: 70;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background:
              radial-gradient(circle at 18% 12%, rgba(159, 227, 211, 0.6), transparent 32rem),
              linear-gradient(160deg, #f7fbf5 0%, #eaf7ee 48%, #d9f8ee 100%);
            padding: calc(5.25rem + env(safe-area-inset-top)) 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
          }

          .mobile-menu-shell {
            display: flex;
            height: 100%;
            max-width: 24rem;
            margin: 0 auto;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
          }

          .mobile-menu-logo {
            width: min(12rem, 70vw);
          }

          .mobile-menu-nav {
            display: grid;
            margin-top: 1.5rem;
          }

          .mobile-menu-link {
            display: flex;
            min-height: 3.5rem;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #d7ebe4;
            padding: 0.75rem 0;
            color: #073b75;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.12;
            transition: color 180ms ease;
          }

          .mobile-menu-link:hover,
          .mobile-menu-link:focus-visible {
            color: #0b7f78;
          }

          .mobile-menu-link:focus-visible,
          .mobile-menu-map:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px #9fe3d3;
          }

          .mobile-menu-index {
            display: flex;
            height: 2rem;
            width: 2rem;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: #ffffff;
            color: #0b7f78;
            font-size: 0.72rem;
            font-weight: 700;
          }

          .mobile-menu-map {
            display: inline-flex;
            min-height: 3.25rem;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: #073b75;
            padding: 0.8rem 1.25rem;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 14px 30px rgba(7, 59, 117, 0.18);
            transition: background 180ms ease;
          }

          .mobile-menu-map:hover {
            background: #0b7f78;
          }

          @media (max-height: 620px) {
            .mobile-menu-panel {
              padding-top: calc(4.35rem + env(safe-area-inset-top));
              padding-bottom: calc(0.9rem + env(safe-area-inset-bottom));
            }

            .mobile-menu-logo {
              width: min(9.75rem, 58vw);
            }

            .mobile-menu-nav {
              margin-top: 0.85rem;
            }

            .mobile-menu-link {
              min-height: 2.85rem;
              padding: 0.55rem 0;
              font-size: 1.08rem;
            }

            .mobile-menu-index {
              height: 1.75rem;
              width: 1.75rem;
              font-size: 0.66rem;
            }

            .mobile-menu-map {
              min-height: 3rem;
              padding: 0.7rem 1rem;
              font-size: 0.88rem;
            }
          }

          @media (max-height: 500px) {
            .mobile-menu-panel {
              padding-top: calc(3.8rem + env(safe-area-inset-top));
            }

            .mobile-menu-logo {
              display: none;
            }

            .mobile-menu-nav {
              margin-top: 0;
            }

            .mobile-menu-link {
              min-height: 2.55rem;
              font-size: 1rem;
            }
          }

          '''
          mobile_css = '\n'.join(line[10:] if line.startswith('          ') else line for line in mobile_css.splitlines()) + '\n'
          if 'body:has(.mobile-menu[open])' not in css:
              marker = '.hero-readable-overlay {'
              if marker not in css:
                  raise SystemExit('CSS insertion marker not found')
              css = css.replace(marker, mobile_css + marker, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Validate
        run: |
          npm run lint
          npm run build:github-pages
          touch docs/.nojekyll

      - name: Commit fixed menu
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix mobile menu full-screen layout [skip ci]"
            git push
          fi
